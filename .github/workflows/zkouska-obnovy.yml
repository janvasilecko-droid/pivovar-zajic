name: Měsíční zkouška obnovy zálohy

# Záloha, kterou nikdo nezkusil obnovit, je jen naděje. Jednou měsíčně se
# šifrovaná záloha rozšifruje, porovná s manifestem a nahraje do PRÁZDNÉ
# dočasné databáze (služba postgres níž) — nikdy ne na produkci.
# Podrobnosti: scripts/zkouska-obnovy.mjs.
#
# Potřebuje secret ZALOHA_HESLO (stejný jako denní záloha).

on:
  schedule:
    # 1. den v měsíci, 05:00 UTC — po noční záloze.
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zkouska:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zkouska
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obnovit nanečisto a ověřit
        env:
          ZALOHA_HESLO: ${{ secrets.ZALOHA_HESLO }}
          DATABASE_URL: postgres://postgres:zkouska@localhost:5432/postgres
        run: node scripts/zkouska-obnovy.mjs

      # 📚 Záloha projektu bible (zalohy/bible/) — jen když už nějaká vznikla.
      - name: Obnovit nanečisto zálohu projektu bible
        if: always()
        env:
          ZALOHA_HESLO: ${{ secrets.ZALOHA_HESLO }}
          DATABASE_URL: postgres://postgres:zkouska@localhost:5432/postgres
        run: |
          if [ ! -f zalohy/bible/manifest.json ]; then
            echo "Záloha projektu bible zatím neexistuje — přeskočeno." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/zkouska-obnovy.mjs --sada bible

  oznam-selhani:
    runs-on: ubuntu-latest
    needs: [zkouska]
    if: failure()
    steps:
      - name: Založit issue o selhání
        uses: actions/github-script@v7
        with:
          script: |
            const beh = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Zkouška obnovy zálohy selhala — běh #${context.runNumber}`,
              body: [
                '**Zálohu se nepodařilo obnovit nanečisto.** Pokud by bylo potřeba obnovovat doopravdy, nemusela by fungovat.',
                '',
                `Běh (souhrn s důvodem): ${beh}`,
              ].join('\n'),
            });
