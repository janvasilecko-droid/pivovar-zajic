name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write — aby GITHUB_TOKEN mohl pushnout „chore: bump version" commit.
# issues: write — aby při selhání šlo založit issue (viz job `oznam-selhani`).
permissions:
  contents: write
  issues: write

jobs:
  # Testy (vitest) běží PŘED deployem — bez nich by se rozbitý kód dostal
  # na Cloudflare. build-and-deploy i build-apk mají needs: test, takže
  # selhání testů zastaví celý release.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      # Sdílená cache node_modules mezi joby stejného běhu (test běží první,
      # naplní ji; build-and-deploy a build-apk pak npm ci přeskočí úplně
      # misto opakovane instalace stejnych zavislosti).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # vitest běží headless (jsdom), žádný browser není potřeba.
      - name: Run tests
        run: npm test

      # Chybějící třída není v Tailwindu chyba — prostě se z ní nevygeneruje
      # nic a prvek zůstane bez efektu, tiše. Takhle se do aplikace naráz
      # dostalo ~200 mrtvých stylů (jména z Tailwindu v4 ve v3 projektu,
      # neviditelný spinner, 78 souborů bez stínu). Tohle to zastaví dřív,
      # než se to nasadí.
      - name: Kontrola tříd Tailwindu
        run: npm run zkontroluj-tridy

      # Aplikace má dva režimy a tatáž třída má v každém jinou barvu, takže
      # „vypadá to dobře" ve světlém režimu nic negarantuje. Skript spočítá
      # poměr kontrastu u každé dvojice písmo/podklad zapsané na jednom prvku —
      # zvlášť pro světlý a zvlášť pro tmavý režim.
      - name: Kontrola kontrastu
        run: npm run zkontroluj-kontrast

      # Kontrola workflow souborů. Tady je to jen pojistka pro budoucí změny
      # — neplatný workflow se totiž nespustí VŮBEC, takže tenhle krok by
      # u něj nikdy neproběhl. Hlavní místo, kde se to musí chytit, je hook
      # před commitem (.githooks/pre-commit).
      - name: Kontrola workflow
        run: npm run zkontroluj-workflow

      # Vzhled tlačítek. Aplikace má pět rolí (.btn-primary, .btn-emerald,
      # .btn-ghost, .btn-danger, .btn-pocet), ale 174 tlačítek si maluje
      # vlastní barvu — odtud „vypadá to jako čtyři různé aplikace".
      # Kontrola stávající dluh NEHLÁSÍ (to by byl výpis 167 chyb u každého
      # commitu), spadne jen když dluh naroste. Základ je v
      # scripts/tlacitka-zaklad.json a po každé převedené obrazovce se zmenší.
      - name: Kontrola tlačítek
        run: npm run zkontroluj-tlacitka

      # Velikost dotykových cílů. Aplikace se ovládá na telefonu, ale
      # `min-h-[44px]` platí jen pro .btn a pro pole — holá <button> tudy
      # propadala, a bylo jich 312 s odsazením py-1 a menším. Lék je třída
      # .tap (zvětší plochu, nezmění rozložení). Hlásí jen zhoršení.
      - name: Kontrola dotykových cílů
        run: npm run zkontroluj-dotyk

      # Popisky tlačítek. Ikonové tlačítko musí mít aria-label (title se na
      # dotyku nezobrazí), ale tlačítko S TEXTEM ho mít NESMÍ — aria-label
      # přístupné jméno nahrazuje, takže by z „Mám všech 3" bylo něco jiného.
      # Tuhle chybu jsem udělal při hromadném doplňování na 53 místech.
      - name: Kontrola popisků
        run: npm run zkontroluj-popisky

      # Edge funkce (supabase/functions). Běží v Denu, takže je nevidí ani
      # `tsc` aplikace, ani vitest — překlep ve jménu proměnné se pozná až
      # v provozu. 18. 9. 2026 se takhle do čtení WhatsAppu dostalo
      # `parsedData` místo `parseResult`: každá objednávka od 21. 9. spadla
      # na „parsedData is not defined" a musela se přepisovat ručně.
      - name: Kontrola edge funkcí
        run: npm run zkontroluj-edge-funkce

      # ESLint. Projekt ho do 5. 9. 2026 neměl a hned v prvním běhu našel
      # dvě skutečné chyby: hook volaný až za `return null` (React na to
      # spadne při otevření modalu) a `let mounted = true`, které se nikdy
      # nepřepnulo, takže zrušení běžícího načtení nikdy nefungovalo.
      # Nastavení je mírné: varování se tolerují (je jich 1139 a utahují se
      # po částech), padá se jen na chybách.
      - name: Lint
        run: npm run lint

      # E2E: jeden scénář zápisu (týdenní inventura) proti SKUTEČNÉ
      # komponentě aplikace, jen s paměťovou náhradou Supabase z náhledu.
      # Testů je přes 1300, ale sto z nich kontroluje výpočty — klikání
      # nepokrýval žádný, a přitom právě odtud jsou hlášení z provozu.
      # Náhled se pustí na pozadí, počká se na něj a po testu se zabije.
      # Bez prohlížeče skript sám sebe přeskočí, takže CI kvůli tomu
      # nezčervená.
      - name: E2E scénář
        run: |
          npx vite --config vite.nahled.config.ts &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5199/panel.html > /dev/null && break
            sleep 1
          done
          npm run e2e
          kill %1 || true
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Zvýšit verzi aplikace (patch) v src/lib/version.ts a public/version.json.
      # Bez toho by se verze nikdy nezměnila a auto-aktualizace v aplikaci
      # by se nespustila (porovnává version.json se serveru s lokální APP_VERSION).
      - name: Bump version
        run: node bump-version-ci.mjs

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Velikost toho, co se stahuje při STARTU aplikace (vstupní skript +
      # modulepreload z dist/index.html), v gzipu. Chytá případ, kdy se do
      # hlavního kusu omylem dostane knihovna, která tam nepatří — přesně
      # tak se do startu dostalo 537 kB grafů a půl roku si toho nikdo
      # nevšiml, protože build projde a aplikace funguje, jen se načítá déle.
      - name: Kontrola velikosti startu
        run: npm run zkontroluj-velikost

      # Commitnout zvýšenou verzi zpět do repozitáře PŘED deployem — i když
      # Cloudflare deploy selže, GitHub má vždy nejnovější verzi (a APK job
      # checkoutuje post-bump commit, takže APK nese stejné číslo jako web).
      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/version.ts public/version.json android/app/build.gradle
          git commit -m "chore: bump version [skip ci]" || echo "No changes to commit"
          # Robustní push: explicitní refspec funguje i z detached HEAD,
          # retry vyřeší non-fast-forward race při souběžných pushech.
          git push origin main && exit 0
          for attempt in 1 2 3; do
            echo "push selhal (pokus $attempt), stahuji nejnovější main a zkouším znovu..."
            git pull --rebase origin main || true
            git push origin main && exit 0
          done
          echo "Push se nezdařil ani po opakovaných pokusech."
          exit 1

      # Deploy na Cloudflare Pages. Bez continue-on-error — selhání deploye
      # (chybějící/neplatný CF_API_TOKEN apod.) musí viditelně zčervenat,
      # ne se tvářit, že workflow prošlo.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=zajic-pivovar --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # 🗄️ Databáze a edge funkce — dřív se musely nasazovat ručně a zapomínalo
  # se na to: aplikace byla na produkci, tabulka nebo funkce, kterou
  # potřebuje, ne. Běží AŽ po nasazení webu.
  #
  # Obojí je bez klíče vypnuté, ne rozbité: bez SUPABASE_ACCESS_TOKEN se
  # kroky jen ohlásí a skončí úspěšně. Migrace se navíc pouštějí jen při
  # proměnné AUTO_MIGRACE=ano a s pojistkami (scripts/pust-cekajici-migrace.mjs).
  #
  # `secrets` v `if:` použít nejde (viz oznam-selhani níž) — klíč jde do env
  # a prázdnota se ověřuje v shellu.
  nasad-databazi-a-funkce:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Čekající migrace
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUTO_MIGRACE: ${{ vars.AUTO_MIGRACE }}
        run: node scripts/pust-cekajici-migrace.mjs

      # Nasazují se funkce, jejichž OBSAH se liší od toho, co na Supabase běží
      # (otisk v supabase/nasazeno.json). Změna v _shared/ se propisuje do
      # otisku každé funkce, která si ten soubor importuje, takže jdou všechny
      # dotčené — a jen ty.
      #
      # ⚠️ Dřív se výběr dělal z git diffu proti předchozímu commitu. Když běh
      # spadl dřív, než se nasadilo (třeba na testu), změna se ztratila: další
      # běh už ve svém diffu žádnou edge funkci neviděl a nasadit ji neměl jak
      # už nikdy. Právě tohle potkalo běhy #730 a #731 (19. 9. 2026) — oprava
      # čtení zpráv zůstala ležet v mainu a v provozu běžela stará verze.
      # Otisk obsahu je samoopravný: říká, co se od nahrané verze liší, takže
      # zmeškané nasazení dojede sám další běh.
      #
      # `always()`: hlášení o migracích nesmí zabránit nasazení funkcí. 18. 9.
      # 2026 krok s migracemi spadl na HTTP 403 a s ním celý job — edge funkce
      # se pak nenasadily, přestože klíč už v repozitáři byl.
      - name: Změněné edge funkce
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN není nastaven — edge funkce se nasazují ručně." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FUNKCE=$(node scripts/zkontroluj-nasazeni.mjs --jen-jmena)
          if [ -z "$FUNKCE" ]; then
            echo "Edge funkce: všechno už běží v poslední verzi." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Edge funkce" >> "$GITHUB_STEP_SUMMARY"
          SELHALO=0
          NASAZENE=""
          for f in $FUNKCE; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            if npx --yes supabase functions deploy "$f" --project-ref sasqexjadvlqyticxwja; then
              echo "- ✅ $f" >> "$GITHUB_STEP_SUMMARY"
              NASAZENE="$NASAZENE $f"
            else
              echo "- ❌ $f" >> "$GITHUB_STEP_SUMMARY"
              SELHALO=1
            fi
          done

          # Zapsat, co teď na Supabase běží. Bez toho se nasazení nedá odlišit
          # od nenasazení a připomínka při otevření Claude Code hlásí i funkce,
          # které dávno běží (a seznam, který je pokaždé celý, si člověk
          # odvykne číst). Zapisují se jen ty, které se OPRAVDU nasadily.
          if [ -n "$NASAZENE" ]; then
            node scripts/zapis-nasazeni.mjs $NASAZENE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/nasazeno.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: zaznamenat nasazené edge funkce [skip ci]"
              git push origin HEAD:main || for attempt in 1 2 3; do
                echo "push selhal (pokus $attempt), stahuji main a zkouším znovu..."
                git pull --rebase origin main || true
                git push origin HEAD:main && break
              done
            fi
          fi
          exit $SELHALO

  build-apk:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      # Checkout aktuální main (včetně "chore: bump version" commitu),
      # aby APK nesl stejnou verzi jako web (ne o verzi starší).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # cap sync (= cap update + cap copy) je nutný: generuje
      # android/capacitor-cordova-android-plugins/ a capacitor.plugins.json,
      # které gradle build potřebuje (cap copy je negeneruje a nejsou
      # v gitu — jsou ignorované android/.gitignore).
      - name: Sync to Capacitor
        run: npx cap sync

      # Capacitor 8 Android generuje capacitor.build.gradle se
      # sourceCompatibility/targetCompatibility = Java 21 — JDK 17 by selhal
      # s „invalid source release: 21", proto je nutné JDK 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # `packages: ''` je nutné: akce jinak ve výchozím stavu pouští
      # `sdkmanager tools`, ale balíček `tools` Google ze SDK odstranil —
      # sdkmanager skončí „Warning: Failed to find package 'tools'“ a návratovým
      # kódem 1, takže celý job spadne ještě před překladečem (16. 9. 2026).
      # Co build opravdu potřebuje (platforms, build-tools), si gradle stáhne
      # sám a platform-tools jsou v obrazu runneru už předinstalované.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pivovar-zajic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # APK ke stažení přímým odkazem. Artefakt o krok výš zůstává (hodí se,
      # když je potřeba sáhnout po APK z jednoho konkrétního běhu), ale
      # instalovat z něj do telefonu se prakticky nedá: chce přihlášení na
      # GitHub, stáhne se jako zip a po 90 dnech ho GitHub smaže. Release je
      # proti tomu veřejný přímý odkaz na .apk, který nevyprší.
      #
      # Nahrávají se dva soubory, obsahem stejné. Ten s číslem verze je pro
      # přehled; ten pod stálým jménem pivovar-zajic.apk existuje jen kvůli
      # tomu, že jedině s neměnným jménem funguje odkaz, který se dá jednou
      # uložit do záložek v telefonu a už nikdy neměnit:
      #   .../releases/latest/download/pivovar-zajic.apk
      #
      # APK je z assembleDebug, tedy podepsané ladicím klíčem: telefon si při
      # instalaci vyžádá povolení „z neznámých zdrojů" a přes dřívější APK
      # podepsané jiným klíčem se nenainstaluje (nejdřív odinstalovat).
      - name: Vystavit APK jako Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERZE=$(node -p "require('./public/version.json').version")
          SHA=$(git rev-parse HEAD)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "pivovar-zajic-$VERZE.apk"
          cp "$APK" "pivovar-zajic.apk"

          cat > poznamky.md <<EOF
          Aplikace pro Android, verze $VERZE.

          Do telefonu stáhnout soubor **pivovar-zajic.apk** níže. Tenhle odkaz míří
          vždycky na nejnovější verzi, takže stačí jednou uložit do záložek:

          https://github.com/$REPO/releases/latest/download/pivovar-zajic.apk

          Web se na stejnou verzi aktualizuje sám, tohle je jen pro telefon.
          EOF

          # Značka už existovat může (opakovaný běh nad týmž commitem). Tehdy
          # se soubory jen přepíšou — nasazení kvůli tomu padat nemá.
          if gh release view "v$VERZE" > /dev/null 2>&1; then
            gh release upload "v$VERZE" "pivovar-zajic-$VERZE.apk" "pivovar-zajic.apk" --clobber
          else
            gh release create "v$VERZE" "pivovar-zajic-$VERZE.apk" "pivovar-zajic.apk" \
              --target "$SHA" \
              --title "Verze $VERZE" \
              --notes-file poznamky.md \
              --latest
          fi

  # ❗ SELHÁNÍ NESMÍ BÝT TICHÉ.
  #
  # Když spadne `test` (testy, kontrola tříd, kontrast), deploy job se přes
  # `needs` ani nezaloží — a protože nic nekřičí, projeví se to jen tím, že
  # „appka nechce aktualizovat". Takhle skončily tři pushe za sebou a přišlo
  # se na to až po dvou dnech.
  #
  # Issue je schválně: funguje BEZ jakéhokoliv nového klíče (stačí vestavěný
  # GITHUB_TOKEN) a GitHub o něm pošle e-mail. Kdo chce hlášku i do WhatsAppu,
  # doplní v Nastavení repozitáře klíč SEND_TOKEN a proměnnou BRIDGE_URL —
  # druhý krok se pak sám zapne.
  oznam-selhani:
    runs-on: ubuntu-latest
    needs: [test, build-and-deploy, build-apk, nasad-databazi-a-funkce]
    if: failure()

    steps:
      - name: Založit issue o selhání
        uses: actions/github-script@v7
        with:
          script: |
            const beh = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const telo = [
              '**Nasazení neproběhlo.** Na webu zůstala předchozí verze, takže',
              'se v aplikaci nenabídne aktualizace — to je ten příznak, po kterém',
              'se to nejčastěji pozná.',
              '',
              `Běh: ${beh}`,
              `Commit: ${context.sha}`,
              '',
              'Nejčastější příčiny (v tomhle pořadí):',
              '1. `npm test` — spadl test,',
              '2. `zkontroluj-tridy` — třída, kterou Tailwind nezná (nevygeneruje se z ní nic),',
              '3. `zkontroluj-kontrast` — dvojice písmo/podklad pod 4,5 : 1,',
              '4. `Deploy to Cloudflare Pages` — neplatný CF_API_TOKEN.',
              '',
              'Obojí z bodů 2 a 3 jde pustit lokálně: `npm run zkontroluj-tridy`,',
              '`npm run zkontroluj-kontrast` (a `git config core.hooksPath .githooks`,',
              'ať to příště chytne už před commitem).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nasazení selhalo — běh #${context.runNumber}`,
              body: telo,
            });

      # Volitelně i do WhatsAppu. Bez klíčů se krok přeskočí, ne že spadne —
      # upozornění na selhání nemá selhat kvůli chybějícímu nastavení.
      #
      # POZOR: `secrets` se v `if:` použít NESMÍ. GitHub kontroluje výrazy už
      # při čtení souboru a workflow s `secrets.X` v `if` celý zahodí jako
      # neplatný — nespustí se ani jeden job, jen se běh objeví červený a
      # bez jobů. Přesně tohle tady jednou stálo dvě nasazení. Klíč se proto
      # předá do `env` (tam povolený je) a prázdnota se ověří v shellu;
      # v `if` zůstanou jen `vars`.
      - name: Napsat do WhatsApp skupiny (jen když je nastaveno)
        if: ${{ vars.BRIDGE_URL != '' && vars.BRIDGE_CHAT_ID != '' }}
        continue-on-error: true
        env:
          SEND_TOKEN: ${{ secrets.SEND_TOKEN }}
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_CHAT_ID: ${{ vars.BRIDGE_CHAT_ID }}
        run: |
          if [ -z "$SEND_TOKEN" ]; then
            echo "SEND_TOKEN není nastaven — WhatsApp hlášku přeskakuji (issue výš přišlo)."
            exit 0
          fi
          curl -sS -m 20 -X POST "$BRIDGE_URL/send" \
            -H "Content-Type: application/json" \
            -H "x-send-token: $SEND_TOKEN" \
            -d "{\"chatId\":\"$BRIDGE_CHAT_ID\",\"text\":\"Nasazeni pivovarske aplikace SELHALO (beh #${{ github.run_number }}). Na webu zustala predchozi verze.\"}"
