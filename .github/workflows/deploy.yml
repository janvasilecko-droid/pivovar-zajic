name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Vyžadováno, aby GITHUB_TOKEN mohl pushnout „chore: bump version" commit.
permissions:
  contents: write

jobs:
  # Testy (vitest) běží PŘED deployem — bez nich by se rozbitý kód dostal
  # na Cloudflare. build-and-deploy i build-apk mají needs: test, takže
  # selhání testů zastaví celý release.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      # Sdílená cache node_modules mezi joby stejného běhu (test běží první,
      # naplní ji; build-and-deploy a build-apk pak npm ci přeskočí úplně
      # misto opakovane instalace stejnych zavislosti).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # vitest běží headless (jsdom), žádný browser není potřeba.
      - name: Run tests
        run: npm test

      # Chybějící třída není v Tailwindu chyba — prostě se z ní nevygeneruje
      # nic a prvek zůstane bez efektu, tiše. Takhle se do aplikace naráz
      # dostalo ~200 mrtvých stylů (jména z Tailwindu v4 ve v3 projektu,
      # neviditelný spinner, 78 souborů bez stínu). Tohle to zastaví dřív,
      # než se to nasadí.
      - name: Kontrola tříd Tailwindu
        run: npm run zkontroluj-tridy

      # Aplikace má dva režimy a tatáž třída má v každém jinou barvu, takže
      # „vypadá to dobře" ve světlém režimu nic negarantuje. Skript spočítá
      # poměr kontrastu u každé dvojice písmo/podklad zapsané na jednom prvku —
      # zvlášť pro světlý a zvlášť pro tmavý režim.
      - name: Kontrola kontrastu
        run: npm run zkontroluj-kontrast

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Zvýšit verzi aplikace (patch) v src/lib/version.ts a public/version.json.
      # Bez toho by se verze nikdy nezměnila a auto-aktualizace v aplikaci
      # by se nespustila (porovnává version.json se serveru s lokální APP_VERSION).
      - name: Bump version
        run: node bump-version-ci.mjs

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Commitnout zvýšenou verzi zpět do repozitáře PŘED deployem — i když
      # Cloudflare deploy selže, GitHub má vždy nejnovější verzi (a APK job
      # checkoutuje post-bump commit, takže APK nese stejné číslo jako web).
      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/version.ts public/version.json android/app/build.gradle
          git commit -m "chore: bump version [skip ci]" || echo "No changes to commit"
          # Robustní push: explicitní refspec funguje i z detached HEAD,
          # retry vyřeší non-fast-forward race při souběžných pushech.
          git push origin main && exit 0
          for attempt in 1 2 3; do
            echo "push selhal (pokus $attempt), stahuji nejnovější main a zkouším znovu..."
            git pull --rebase origin main || true
            git push origin main && exit 0
          done
          echo "Push se nezdařil ani po opakovaných pokusech."
          exit 1

      # Deploy na Cloudflare Pages. Bez continue-on-error — selhání deploye
      # (chybějící/neplatný CF_API_TOKEN apod.) musí viditelně zčervenat,
      # ne se tvářit, že workflow prošlo.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=zajic-pivovar --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  build-apk:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      # Checkout aktuální main (včetně "chore: bump version" commitu),
      # aby APK nesl stejnou verzi jako web (ne o verzi starší).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          # Node >= 22 je vyžadován @capacitor/cli@8 (engines: node >=22).
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # cap sync (= cap update + cap copy) je nutný: generuje
      # android/capacitor-cordova-android-plugins/ a capacitor.plugins.json,
      # které gradle build potřebuje (cap copy je negeneruje a nejsou
      # v gitu — jsou ignorované android/.gitignore).
      - name: Sync to Capacitor
        run: npx cap sync

      # Capacitor 8 Android generuje capacitor.build.gradle se
      # sourceCompatibility/targetCompatibility = Java 21 — JDK 17 by selhal
      # s „invalid source release: 21", proto je nutné JDK 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pivovar-zajic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
