name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Zvýšit verzi aplikace (patch) v src/lib/version.ts a public/version.json.
      # Bez toho by se verze nikdy nezměnila a auto-aktualizace v aplikaci
      # by se nespustila (porovnává version.json se serveru s lokální APP_VERSION).
      - name: Bump version
        run: node bump-version-ci.mjs

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Commitnout zvýšenou verzi zpět do repozitáře PŘED deployem — i když
      # Cloudflare deploy selže, GitHub má vždy nejnovější verzi (a APK job
      # checkoutuje post-bump commit, takže APK nese stejné číslo jako web).
      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/version.ts public/version.json android/app/build.gradle
          git commit -m "chore: bump version [skip ci]" || echo "No changes to commit"
          git push

      # Deploy na Cloudflare Pages. continue-on-error: pokud secret
      # CF_API_TOKEN chybí/neplatí, krok se označí jako varování, ale
      # workflow pokračuje a build APK proběhne vždy.
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        run: npx wrangler pages deploy dist --project-name=zajic-pivovar --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  build-apk:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      # Checkout aktuální main (včetně "chore: bump version" commitu),
      # aby APK nesl stejnou verzi jako web (ne o verzi starší).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy to Capacitor
        run: npx cap copy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pivovar-zajic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
