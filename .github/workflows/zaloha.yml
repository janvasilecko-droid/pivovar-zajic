name: Denní záloha objednávek a stáčení

# Zálohuje databázi do adresáře `zalohy/` v tomhle repozitáři — ZAŠIFROVANĚ,
# protože repozitář je veřejný (scripts/lib/sifraZalohy.mjs). Každý den =
# jeden commit, takže historie gitu funguje jako bodová obnova.
#
# ⚠️ POTŘEBUJE SECRETY (Settings → Secrets and variables → Actions):
#    SUPABASE_SERVICE_ROLE_KEY  servisní klíč — obchází oprávnění, nikam ho nekopíruj
#    ZALOHA_HESLO               heslo šifrování, aspoň 12 znaků. ULOŽ HO I MIMO GITHUB —
#                               bez něj zálohu nikdo neobnoví.
#    Bez nich workflow skončí chybou a nic se nezapíše (ani nezašifrovaně) — záměrně.

on:
  schedule:
    # 02:30 UTC = 04:30 v létě / 03:30 v zimě — po nočním odpočtu závozu.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: zaloha
  cancel-in-progress: false

jobs:
  zaloha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout a zašifrovat data
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZALOHA_HESLO: ${{ secrets.ZALOHA_HESLO }}
        run: node scripts/zaloha-objednavek.mjs

      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A: zachytí i smazání starých nešifrovaných souborů.
          git add -A zalohy/
          if git diff --staged --quiet; then
            echo "Není co commitovat."
            exit 0
          fi
          git commit -m "chore: šifrovaná záloha $(date +%Y-%m-%d) [skip ci]"
          # Mezitím mohl přijít jiný commit (třeba bump verze z deploye).
          git pull --rebase origin main
          git push

  # Selhání zálohy nesmí být tiché — stejný vzor jako u nasazení.
  oznam-selhani:
    runs-on: ubuntu-latest
    needs: [zaloha]
    if: failure()
    steps:
      - name: Založit issue o selhání
        uses: actions/github-script@v7
        with:
          script: |
            const beh = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Denní záloha selhala — běh #${context.runNumber}`,
              body: [
                '**Noční záloha databáze neproběhla.** Poslední úspěšná záloha zůstává v `zalohy/`.',
                '',
                `Běh: ${beh}`,
                '',
                'Nejčastější příčiny: chybí secret `ZALOHA_HESLO` nebo `SUPABASE_SERVICE_ROLE_KEY`,',
                'nebo je Supabase nedostupný.',
              ].join('\n'),
            });
