name: Pivovarská bible — zpracování knih

# Zpracuje knihy nahrané v appce (Pivovarská bible → Knihovna dokumentů):
# textová vrstva PDF, tištěná čísla stran, kapitoly, přepis skenů přes Claude
# Haiku s kontrolou Tesseractem, pasáže pro hledání. Kód: scripts/bible/.
# Návrh: docs/pivovarska-bible/ (rozhodnutí R2 — proč GitHub Actions).
#
# ⚠️ REPOZITÁŘ JE VEŘEJNÝ, LOGY TAKY. Worker do logu píše jen ID dokumentů,
#    počty a stavy — nikdy text ani název knihy. Žádné artefakty.
#
# Spouští se:
#  • ručně: Actions → „Pivovarská bible — zpracování knih" → Run workflow
#    (volitelně ID jednoho dokumentu),
#  • záložně podle plánu (GitHub plánované běhy zpožďuje i o hodiny),
#  • testy workeru a migrací bible při jejich změně v main i na pull requestu
#    (bez zpracování) — migraci databáze bible jde pustit z appky hned po
#    nasazení, proto se kontroly musí projít ještě před sloučením.
#
# Knihy jsou v SAMOSTATNÉM projektu Supabase (projekt bible, rozhodnutí R12):
#  • BIBLE_SUPABASE_SERVICE_ROLE_KEY — klíč service role projektu bible
#    (bez něj se zpracování jen ohlásí a skončí zeleně);
#  • VITE_SUPABASE_URL a SUPABASE_SERVICE_ROLE_KEY — hlavní projekt, jen kvůli
#    klíči Claude (ANTHROPIC_API_KEY z app_secrets; worker ho zamaskuje).

on:
  workflow_dispatch:
    inputs:
      dokument:
        description: 'ID jednoho dokumentu (prázdné = všechny čekající)'
        required: false
        default: ''
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/bible/**'
      - 'supabase/migrations/*pivovarska_bible*'
      - 'supabase/testy/bible/**'
      - 'bible/supabase/migrations/**'
      - 'bible/supabase/testy/**'
      - '.github/workflows/bible-zpracovani.yml'
  pull_request:
    paths:
      - 'scripts/bible/**'
      - 'supabase/migrations/*pivovarska_bible*'
      - 'supabase/testy/bible/**'
      - 'bible/supabase/migrations/**'
      - 'bible/supabase/testy/**'
      - '.github/workflows/bible-zpracovani.yml'

permissions:
  contents: read

jobs:
  # Migrace na čistém PostgreSQL s napodobeným Supabase: dvakrát za sebou
  # (musí jít pustit znovu) a pak kontroly — zvlášť projekt bible (zavřená
  # databáze, nahrávání, fronta, hledání: bible/supabase/testy/) a hlavní
  # projekt (bible_pristup, bible_overeni, zavřená stará cesta:
  # supabase/testy/bible/). Rozbitá oprávnění tak neprojdou potichu.
  migrace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zkouska
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Migrace a kontroly
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: zkouska
        run: |
          set -euo pipefail
          psql -q -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE bible" -c "CREATE DATABASE hlavni"
          # Projekt bible
          psql -q -v ON_ERROR_STOP=1 -d bible -f bible/supabase/testy/00_stuby.sql
          for kolo in 1 2; do
            for m in $(ls bible/supabase/migrations/*.sql | sort); do
              psql -q -v ON_ERROR_STOP=1 -d bible -1 -f "$m"
            done
          done
          psql -q -t -A -v ON_ERROR_STOP=1 -d bible -f bible/supabase/testy/10_kontroly.sql
          # Hlavní projekt (migrace bible, které v něm zůstaly)
          psql -q -v ON_ERROR_STOP=1 -d hlavni -f supabase/testy/bible/00_stuby.sql
          for kolo in 1 2; do
            for m in $(ls supabase/migrations/*_pivovarska_bible_*.sql | sort); do
              psql -q -v ON_ERROR_STOP=1 -d hlavni -1 -f "$m"
            done
          done
          psql -q -t -A -v ON_ERROR_STOP=1 -d hlavni -f supabase/testy/bible/10_kontroly.sql

  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/bible/requirements-testy.txt

      # Testy skutečný Tesseract nepotřebují (jeho dostupnost i volání podvrhují),
      # instaluje se jen pro úplnost. Výpadek zrcadel Ubuntu (11. 11. 2026 runnery
      # nepřeložily security.ubuntu.com, apt čekal 9 minut a job spadl dřív, než
      # začaly testy) proto testy nezablokuje: krok má strop 5 minut a jeho chyba
      # job nezastaví. Ve zpracování knih níž zůstává instalace povinná.
      - name: Tesseract (kontrolní čtení skenů)
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ces tesseract-ocr-deu > /dev/null

      # Celý strom závislostí je zamčený i s hashi (scripts/bible/requirements*.txt):
      # nová verze kteréhokoli balíčku se dostane dovnitř jen přes PR s testy.
      - name: Závislosti (zamčené)
        run: pip install -q --require-hashes --no-deps -r scripts/bible/requirements-testy.txt

      - name: Testy workeru
        working-directory: scripts/bible
        run: python -m pytest -q tests

  zpracovani:
    needs: [testy, migrace]
    # Jen plán a ruční spuštění — nikdy push ani pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Zpracování jen jedno naráz (ruční běh a plánovaný sdílí frontu — vezme
    # i dokument zadaný ručně). Testy a migrace po pushi se tím nezdržují ani neruší.
    concurrency:
      group: bible-zpracovani
      cancel-in-progress: false
    steps:
      # Bez práce se nic neinstaluje: dotaz na čekající dokumenty v projektu
      # bible (jen id, žádný obsah). Bez klíče nebo bez tabulek (migrace bible
      # ještě neběžela) → nic, zeleně. Odmítnutý klíč nebo špatná adresa → červeně.
      - name: Čeká něco?
        id: fronta
        env:
          BIBLE_URL: https://cegrelgvkygcatupqwrx.supabase.co
          BIBLE_KLIC: ${{ secrets.BIBLE_SUPABASE_SERVICE_ROLE_KEY }}
          UDALOST: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$BIBLE_KLIC" ]; then
            echo "prace=ne" >> "$GITHUB_OUTPUT"
            echo "Chybí secret BIBLE_SUPABASE_SERVICE_ROLE_KEY (klíč projektu bible) — zpracování se nespustí." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Ruční spuštění = projít vždy (např. po změně verze přehledů, kterou plán nepozná).
          if [ "$UDALOST" = "workflow_dispatch" ]; then
            echo "prace=ano" >> "$GITHUB_OUTPUT"
            echo "Ruční spuštění — worker projde frontu, překlad, oblasti i přehledy."
            exit 0
          fi
          kod=$(curl -sS --max-time 30 -o odpoved.json -w '%{http_code}' \
            "$BIBLE_URL/rest/v1/bible_dokumenty?select=id&stav=in.(ceka,zpracovava)&limit=1" \
            -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)
          if [ "$kod" = "200" ] && jq -e 'type == "array" and length > 0' odpoved.json > /dev/null 2>&1; then
            echo "prace=ano" >> "$GITHUB_OUTPUT"
          elif [ "$kod" = "200" ]; then
            # Žádná kniha nečeká — čeká strana na český překlad? (jen čísla listů, žádný text)
            # Bez sloupců překladu (migrace 20261103000000_bible_preklad ještě neběžela) → nic.
            kod2=$(curl -sS --max-time 30 -o preklad.json -w '%{http_code}' \
              "$BIBLE_URL/rest/v1/bible_strany?select=pdf_index&preklad_platny=is.false&limit=1" \
              -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)
            if [ "$kod2" = "200" ] && jq -e 'type == "array" and length > 0' preklad.json > /dev/null 2>&1; then
              echo "prace=ano" >> "$GITHUB_OUTPUT"
              echo "Knihy jsou zpracované, čeká český překlad."
            else
              # Přehledy témat: worker drží prehledy_aktualni = false, dokud je neprojde po nové
              # knize nebo překladu. Bez migrace přehledů klíč není → nic.
              kod3=$(curl -sS --max-time 30 -o prehledy.json -w '%{http_code}' \
                "$BIBLE_URL/rest/v1/bible_nastaveni?select=hodnota&klic=eq.prehledy_aktualni" \
                -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)
              # Kniha bez tematických oblastí, kterou Claude ještě nezkoušel zařadit (oblasti.py).
              kod4=$(curl -sS --max-time 30 -o oblasti.json -w '%{http_code}' \
                "$BIBLE_URL/rest/v1/bible_dokumenty?select=id&stav=in.(hotovo,ke_kontrole)&oblasti=eq.%7B%7D&postup->>oblasti_zkouseno=is.null&limit=1" \
                -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)
              if [ "$kod3" = "200" ] && jq -e 'type == "array" and length > 0 and .[0].hodnota == false' prehledy.json > /dev/null 2>&1; then
                echo "prace=ano" >> "$GITHUB_OUTPUT"
                echo "Knihy jsou zpracované a přeložené, čekají přehledy témat."
              elif [ "$kod4" = "200" ] && jq -e 'type == "array" and length > 0' oblasti.json > /dev/null 2>&1; then
                echo "prace=ano" >> "$GITHUB_OUTPUT"
                echo "Knihy čekají na zařazení do tematických oblastí."
              elif [ "$(curl -sS --max-time 30 -o kapitoly.json -w '%{http_code}' \
                       "$BIBLE_URL/rest/v1/bible_kapitoly?select=id&nazev_cs=is.null&limit=1" \
                       -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)" = "200" ] \
                   && jq -e 'type == "array" and length > 0' kapitoly.json > /dev/null 2>&1; then
                # Názvy kapitol bez českého překladu (bez migrace 20261104020000 sloupec není → 400 → nic).
                echo "prace=ano" >> "$GITHUB_OUTPUT"
                echo "Názvy kapitol čekají na český překlad."
              elif [ "$(curl -sS --max-time 30 -o dodatky.json -w '%{http_code}' -X POST \
                       "$BIBLE_URL/rest/v1/rpc/bible_bez_dodatku" -H "Content-Type: application/json" \
                       -d '{"p_verze": 1, "p_limit": 1}' \
                       -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" || echo 000)" = "200" ] \
                   && jq -e 'type == "array" and length > 0' dodatky.json > /dev/null 2>&1; then
                # Zpracované PDF bez dodatku pro rychlé otevření strany v appce (scripts/bible/dodatek.py;
                # p_verze = dodatek.VERZE). Bez migrace 20261111050000 funkce není → 404 → nic.
                echo "prace=ano" >> "$GITHUB_OUTPUT"
                echo "Knihy čekají na dodatek pro rychlé otevření strany v appce."
              else
                echo "prace=ne" >> "$GITHUB_OUTPUT"
                echo "Nic nečeká na zpracování, překlad ani přehledy."
              fi
              rm -f prehledy.json oblasti.json kapitoly.json dodatky.json
            fi
            rm -f preklad.json
          elif jq -e '.code == "PGRST205" or .code == "42P01"' odpoved.json > /dev/null 2>&1; then
            echo "prace=ne" >> "$GITHUB_OUTPUT"
            echo "Databáze bible ještě nemá tabulky — spusť migraci v appce: Systém → Databázové migrace → Databáze bible." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Projekt bible odpověděl HTTP $kod — zkontroluj secret BIBLE_SUPABASE_SERVICE_ROLE_KEY." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          rm -f odpoved.json

      - uses: actions/checkout@v4

      # Které migrace bible ještě neběžely (evidence migrace_aplikovane, jen názvy) —
      # bez nich nejde překlad, hledání, přehledy, konektor… Do souhrnu běhu
      # s odkazem, kde je majitel spustí; zpracování to nezastaví.
      - name: Čekající migrace bible
        env:
          BIBLE_URL: https://cegrelgvkygcatupqwrx.supabase.co
          BIBLE_KLIC: ${{ secrets.BIBLE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          [ -n "$BIBLE_KLIC" ] || exit 0
          hotove=$(curl -sS --max-time 30 "$BIBLE_URL/rest/v1/migrace_aplikovane?select=nazev" \
            -H "apikey: $BIBLE_KLIC" -H "Authorization: Bearer $BIBLE_KLIC" | jq -r '.[]?.nazev' 2>/dev/null) || exit 0
          cekaji=""
          for f in $(ls bible/supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            printf '%s\n' "$hotove" | grep -qxF "$n" || cekaji="$cekaji $n"
          done
          if [ -n "$cekaji" ]; then
            {
              echo "### ⚠️ Čekající migrace databáze bible"
              for n in $cekaji; do echo "- \`$n\`"; done
              echo ""
              echo "Spusť je v appce: https://zajic-pivovar.pages.dev/?page=audit → Databázové migrace → blok **Databáze bible** → „Spustit všech … po řadě“."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Všechny migrace bible běží."
          fi

      - uses: actions/setup-python@v5
        if: steps.fronta.outputs.prace == 'ano'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/bible/requirements.txt

      - name: Nástroje (Tesseract, djvulibre)
        if: steps.fronta.outputs.prace == 'ano'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ces tesseract-ocr-deu djvulibre-bin > /dev/null

      # Jen zamčené závislosti workeru s hashi, bez pytestu (v tomhle jobu je service-role klíč).
      - name: Závislosti (zamčené)
        if: steps.fronta.outputs.prace == 'ano'
        run: pip install -q --require-hashes --no-deps -r scripts/bible/requirements.txt

      # Claude Code pro přepis skenů z předplatného Claude (secret CLAUDE_CODE_OAUTH_TOKEN,
      # vzniká příkazem „claude setup-token"; 1. 11. 2026: „nechci to dělat přes kredit,
      # mám Claude předplacený"). Verze pevná; bez tokenu se neinstaluje. Krok nevidí
      # žádný klíč — token ani klíče Supabase tu nejsou.
      - name: Claude Code (předplatné)
        if: steps.fronta.outputs.prace == 'ano'
        env:
          MA_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'ano' || 'ne' }}
        run: |
          set -euo pipefail
          if [ "$MA_TOKEN" = "ano" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.316 > /dev/null
            claude --version
          else
            echo "Secret CLAUDE_CODE_OAUTH_TOKEN není — přepis skenů půjde jen přes API klíč (kredit)."
          fi

      # Klíč Claude z app_secrets hlavní appky ve zvláštním kroku: klíč service
      # role HLAVNÍHO projektu tak nikdy nevidí krok, který zpracovává nahrané
      # soubory (PDF, DjVu, Tesseract). Klíč se hned zamaskuje.
      - name: Klíč Claude
        if: steps.fronta.outputs.prace == 'ano'
        env:
          HLAVNI_URL: ${{ secrets.VITE_SUPABASE_URL }}
          HLAVNI_KLIC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          klic=""
          if [ -n "$HLAVNI_URL" ] && [ -n "$HLAVNI_KLIC" ]; then
            klic=$(curl -sS --max-time 30 "$HLAVNI_URL/rest/v1/app_secrets?select=value&key=eq.ANTHROPIC_API_KEY" \
              -H "apikey: $HLAVNI_KLIC" -H "Authorization: Bearer $HLAVNI_KLIC" 2>/dev/null | jq -r '.[0].value // empty' 2>/dev/null) || klic=""
          fi
          if [ -n "$klic" ]; then
            echo "::add-mask::$klic"
            echo "ANTHROPIC_API_KEY=$klic" >> "$GITHUB_ENV"
            echo "Klíč Claude připraven."
          else
            echo "Klíč Claude v app_secrets hlavní appky není (nebo nejde přečíst) — skeny počkají, ostatní se zpracuje."
          fi

      - name: Zpracovat knihy
        if: steps.fronta.outputs.prace == 'ano'
        working-directory: scripts/bible
        env:
          BIBLE_KLIC: ${{ secrets.BIBLE_SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DOKUMENT: ${{ github.event.inputs.dokument }}
          LIMIT_MINUT: '300'
        run: python zpracuj.py
