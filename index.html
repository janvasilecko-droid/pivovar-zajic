    <!-- 🩹 STARŠÍ ANDROID 2/2 — záchranná obrazovka místo bílé stránky.
         Když se appka nerozběhne (starý WebView bez podpory modulů, chyba při startu, stažení
         souborů se nepovedlo, nebo se nenačte do 20 s), nezůstane prázdná bílá plocha, ale
         česky řečeno proč a co s tím (aktualizovat WebView a Chrome, zkontrolovat datum,
         otevřít Diagnostiku telefonu). Když se appka přece jen rozběhne (pomalý telefon),
         obrazovka sama zmizí. Na funkčním telefonu se nestane nic: kontrola jen jednou za
         vteřinu zjišťuje, jestli je v #root něco vykresleno.
         Také ES5 — musí jít rozebrat i tam, kde se appka rozebrat nedá. -->
    <script>
      (function () {
        var LIMIT_MS = 20000, RYCHLE_MS = 4000;
        var ua = navigator.userAgent || '';
        var mc = /Chrom(?:e|ium)\/(\d+)/.exec(ua), ma = /Android (\d+(?:\.\d+)*)/.exec(ua);
        var start = new Date().getTime(), termin = start + LIMIT_MS;
        var duvod = 'dlouho', detail = '', panel = null, cas = null;

        function bezi() {
          var r = document.getElementById('root');
          return !!(r && r.firstChild);
        }
        function el(tag, styl, text) {
          var e = document.createElement(tag);
          if (styl) e.setAttribute('style', styl);
          if (text) e.appendChild(document.createTextNode(text));
          return e;
        }
        function tlacitko(text, akce, hlavni) {
          var b = el('button', 'font:inherit;font-weight:700;padding:12px 16px;margin:0 8px 8px 0;border-radius:8px;cursor:pointer;border:2px solid #1f2937;' +
            (hlavni ? 'background:#f59e0b;color:#1f2937' : 'background:transparent;color:#1f2937'), text);
          b.setAttribute('type', 'button');
          b.onclick = akce;
          return b;
        }
        function odkaz(text, href) {
          var a = el('a', 'color:#92400e;font-weight:700', text);
          a.setAttribute('href', href);
          return a;
        }
        function zrus() {
          if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
          panel = null;
        }
        function obnov() { location.reload(); }
        function vycisti() {
          var stav = document.getElementById('zajic-zachrana-stav'), ukoly = [];
          if (navigator.onLine === false) {
            if (stav) stav.textContent = 'Telefon je offline. Mezipaměť se teď nemaže, aby šla appka po obnovení spustit — zapni internet a zkus to znovu.';
            return;
          }
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              ukoly.push(navigator.serviceWorker.getRegistrations().then(function (r) {
                return Promise.all(r.map(function (x) { return x.unregister(); }));
              }));
            }
          } catch (e) {}
          try {
            if (window.caches && window.caches.keys) {
              ukoly.push(window.caches.keys().then(function (k) {
                return Promise.all(k.map(function (n) { return window.caches['delete'](n); }));
              }));
            }

        }
        function ukaz() {
          if (panel || bezi()) return;
          var android = !!ma, text = {
            moduly: 'Prohlížeč v tomhle telefonu je příliš starý a aplikaci vůbec neumí spustit.',
            soubor: 'Nepodařilo se stáhnout soubory aplikace. Zkontroluj připojení k internetu (Wi-Fi nebo data) a zkus to znovu.',
            chyba: 'Aplikace při startu narazila na chybu. Nejčastější příčinou je starý „Android System WebView“ nebo starý Chrome.',

          }[duvod] || '';

          kryt.appendChild(el('h1', 'font-size:22px;font-weight:700;line-height:1.25;margin:8px 0 12px', 'Aplikace se na tomhle telefonu nespustila'));

    </script>
    <!-- Barva lišty prohlížeče / stavového řádku na Androidu. Byla #090909 —
         skoro černý pruh nad krémovou aplikací. Tuhle hodnotu drží jen do
         chvíle, než se rozběhne JS; pak ji podle zvoleného režimu přepíše
         applyTheme() v src/lib/theme.ts. -->
    <meta name="theme-color" content="#fef9ec" />
    <link rel="manifest" id="manifest-link" href="/manifest.webmanifest" />
    <!-- „Zajíc 2“ (adresa /zajic2/): druhá instalace s vlastním manifestem, názvem
         a přihlášením — viz src/lib/profilAplikace.ts. Musí běžet dřív, než si
         prohlížeč manifest stáhne, proto je to tady a ne v aplikaci. -->
    <script>
      (function () {
        try {
          var druha = /^\/zajic2(\/|$)/.test(location.pathname);
          if (druha) {
            document.getElementById('manifest-link').setAttribute('href', '/manifest-zajic2.webmanifest');
            document.title = 'Zajíc 2';
          }
          // „AI sládek“ (adresa /sladek/, R39): samostatná aplikace s chatbotem — totéž: vlastní manifest,
          // název a tmavá lišta prohlížeče (aplikace je celá tmavá).
          if (/^\/sladek(\/|$)/.test(location.pathname)) {
            document.getElementById('manifest-link').setAttribute('href', '/manifest-sladek.webmanifest');
            document.title = 'AI sládek';

          }

    </script>
